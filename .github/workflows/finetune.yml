# ============================================================================
# 说 · Shuo —「单模型直出」微调产线（全部仅手动触发，push 不消耗 runner；
# 产品回归在 ci.yml）。方法论移植自 Qwen3-subtitle-assistant 的 finetune.yml
# （cpu-smoke / real-mini / gpu-train 全链路已在该仓库 CI 实测跑通）。
#
# 模式：
#   cpu-smoke    （GitHub 托管 runner）4 条样本 + 2 步 LoRA + stub 伪优化，
#                只验证管线可跑通（数据格式 / prefix-target 切分 / 训练回路 /
#                适配器保存与挂载 / 评测脚本）。stub 数据下质量指标不达标是预期。
#   real-mini    CPU 真实微调（--optimizer table，固定对照表，无需 API key）；
#                三项判定全强制：任务生效 / 未遗忘 / 静音双模式为空。
#   gpu-train    真实放量训练（需 self-hosted + gpu runner；--optimizer api，
#                system 消息 = 任务提示词原文，与推理端逐字一致）。
#   onnx-inspect Gate 1 探针：Daumee int8 包张量地图 + 适配器值匹配 go/no-go。
#   onnx-patch   Gate 2 补丁：LoRA ΔW 写回 Daumee 包 → unified 目录 +
#                verify_unified_onnx 在 onnxruntime 上复测（量化后行为必须复验）。
#   ort-e2e      Gate 3 产品运行时：真实 Daumee 包 + cargo test（Rust ort 管线
#                带 context 的转写冒烟，与 src-tauri/src/asr.rs 单测同一入口）。
# ============================================================================
name: finetune-experiment

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式"
        type: choice
        default: "cpu-smoke"
        options: [cpu-smoke, dump-table, real-mini, gpu-train, onnx-inspect, onnx-patch, ort-e2e, gguf-e2, gguf-e2e, gguf-publish]
      model:
        description: "基座模型"
        type: choice
        default: "Qwen/Qwen3-ASR-0.6B"
        options: [Qwen/Qwen3-ASR-0.6B, Qwen/Qwen3-ASR-1.7B]
      samples:
        description: "训练样本数（gpu-train 建议 >= 2000）"
        type: string
        default: "4"
      steps:
        description: "最大训练步数（-1 = 按 epochs 走完）"
        type: string
        default: "2"
      tasks:
        description: "训练任务集（逗号分隔，见 finetune/prompts.py）"
        type: string
        default: "polish_zh,translate_en"
      adapter_run:
        description: "onnx-inspect/onnx-patch 用：适配器 artifact 所在 run id"
        type: string
        default: ""
      adapter_artifact:
        description: "适配器 artifact 名（cpu-smoke 产物=unified-cpu-smoke；real-mini=unified-real-mini）"
        type: string
        default: "unified-cpu-smoke"
      expect:
        description: "gguf-e2 探针语言断言（any=只要求出文本[stub 适配器]；latin=直出英文[真实 translate_en 微调]）"
        type: choice
        default: "any"
        options: [any, latin, cjk]
      source_run:
        description: "gguf-publish 用：产出 shuo-unified-gguf-* artifact 的 gguf-e2 run id"
        type: string
        default: ""
      asr_ratio:
        description: "real-mini verbatim 样本占比（任务数多时调低增密度：4 任务建议 0.25）"
        type: string
        default: "0.35"

permissions:
  contents: read
  actions: read   # 跨 run 下载适配器 artifact 需要

concurrency:
  # 按 mode+model 分组：0.6B 与 1.7B 的同名模式（如 real-mini）可并行跑
  group: finetune-${{ inputs.mode }}-${{ inputs.model }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  HF_HUB_DISABLE_PROGRESS_BARS: "1"
  TOKENIZERS_PARALLELISM: "false"
  MODEL_TAG: ${{ inputs.model == 'Qwen/Qwen3-ASR-1.7B' && '1.7B' || '0.6B' }}
  DAUMEE_REPO: Daumee/Qwen3-ASR-0.6B-ONNX-CPU
  DAUMEE_DIR: models/Qwen3-ASR-0.6B-ONNX-CPU

jobs:
  # ---------------------------------------------------------------- cpu-smoke
  cpu-smoke:
    name: CPU 管线冒烟（非质量验证）
    if: ${{ inputs.mode == 'cpu-smoke' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache HuggingFace 模型（0.6B 约 1.8GB）
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-qwen3-asr-${{ env.MODEL_TAG }}-v1

      - name: 安装依赖（CPU 版 torch + qwen-asr + peft）
        run: |
          set -e
          python -m pip install --quiet --upgrade pip
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          # qwen-asr 会锁定 transformers==4.57.6 / accelerate==1.12.0
          pip install --quiet qwen-asr peft datasets soundfile librosa
          python -c "import importlib.metadata as md, torch, transformers, peft, qwen_asr; \
            print('torch', torch.__version__, '| transformers', transformers.__version__, \
                  '| peft', peft.__version__, '| qwen-asr', md.version('qwen-asr')); \
            print('Qwen3ASRModel:', qwen_asr.Qwen3ASRModel)"

      - name: 构造数据（FLEURS cmn_hans_cn + stub 伪优化 + 静音样本）
        run: |
          python finetune/prepare_data.py \
            --source fleurs --fleurs-lang cmn_hans_cn --limit 4 --eval-limit 2 \
            --max-audio-secs 12 --optimizer stub --tasks "${{ inputs.tasks }}" \
            --asr-ratio 0.4 --silence-samples 2 \
            --audio-dir data/audio --out data/train.jsonl --eval-out data/eval.jsonl \
            --dump-transcripts data/transcripts.txt
          echo "--- train.jsonl 首行（audio 路径截断）---"
          python -c "import json;l=open('data/train.jsonl',encoding='utf-8').readline();d=json.loads(l);d['audio']='...'+d['audio'][-24:];print(json.dumps(d,ensure_ascii=False,indent=2))"
          wc -l data/train.jsonl data/eval.jsonl

      - name: LoRA 微调 2 步（CPU）
        run: |
          python finetune/sft_lora.py \
            --model "${{ inputs.model }}" --train data/train.jsonl --eval data/eval.jsonl \
            --out out/smoke --device cpu --lora --lora-r 8 \
            --max-samples 4 --max-steps 2 --batch-size 1 --grad-acc 1 --lr 2e-4 --log-steps 1

      - name: 评测（CPU；stub 数据下质量指标不达标属预期）
        run: |
          python finetune/eval_unified.py \
            --model "${{ inputs.model }}" --adapter out/smoke/lora \
            --eval data/eval.jsonl --limit 2 --device cpu --silence-secs 2 \
            --source-script cjk --out out/smoke/eval_report.json

      - name: 管线冒烟判定
        run: |
          python - <<'PY'
          import json, math, pathlib
          rep = json.loads(pathlib.Path('out/smoke/train_report.json').read_text(encoding='utf-8'))
          ev = json.loads(pathlib.Path('out/smoke/eval_report.json').read_text(encoding='utf-8'))
          fails = []
          loss = rep.get('final_loss')
          if not isinstance(loss, float) or not math.isfinite(loss) or loss <= 0:
              fails.append(f'final_loss 异常: {loss!r}')
          if rep.get('train_samples', 0) < 1:
              fails.append('训练样本数为 0')
          if rep.get('trainable_params_m', 0) <= 0:
              fails.append('LoRA 可训练参数为 0（适配器没挂上）')
          if not ev.get('samples'):
              fails.append('评测没有任何输出样本')
          sil = ev.get('silence') or {}
          sil_errs = [f"{k}: {v['error']}" for k, v in sil.items()
                      if isinstance(v, dict) and v.get('error')]
          if sil_errs:
              fails.append(f"静音推理报错: {sil_errs}")
          # 输出必须保持 `language X<asr_text>` 可解析形态（raw 里带标签）
          for task, items in (ev.get('samples') or {}).items():
              for s in items:
                  if s.get('out') is None:
                      fails.append(f'{task}: 输出缺失')
          print('=== 管线冒烟结论 ===')
          print(f"  final_loss        = {loss}")
          print(f"  可训练参数(M)     = {rep.get('trainable_params_m')}")
          print(f"  训练耗时(s)       = {rep.get('train_seconds')}")
          print(f"  指标              = {json.dumps(ev.get('metrics'), ensure_ascii=False)}")
          print(f"  静音输出          = {json.dumps(sil, ensure_ascii=False)[:400]}")
          print('注意：本轮用 stub 伪优化 + CPU + 2 步，质量指标不达标是预期行为，')
          print('      本判定只检查"管线是否跑通"。质量验证请用 real-mini / gpu-train。')
          if fails:
              print('失败项:', fails)
              raise SystemExit(1)
          print('✔ 数据格式 / prefix-target 切分 / 训练回路 / 适配器保存与挂载 / 评测脚本 全部跑通')
          PY

      - name: 上传实验产物（含适配器，供 onnx-inspect/onnx-patch 复用）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unified-cpu-smoke
          path: |
            out/smoke/lora
            out/smoke/train_report.json
            out/smoke/eval_report.json
            data/train.jsonl
            data/eval.jsonl
            data/transcripts.txt
          if-no-files-found: warn
          retention-days: 30

  # --------------------------------------------------------------- dump-table
  # 导出 CI 会抽到的那批 FLEURS 转写（流式顺序确定，--limit 相同则样本相同），
  # 供离线整理成 finetune/table_zh.tsv 对照表（real-mini 的免密钥真实数据路线，
  # qsa 同款流程）。轻量 job：不装 torch，只装 datasets+soundfile。
  dump-table:
    name: 导出 FLEURS 转写（供离线整理对照表）
    if: ${{ inputs.mode == 'dump-table' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 安装轻量依赖（无 torch）
        run: pip install --quiet datasets soundfile numpy

      - name: 导出转写（与 real-mini 同参数：limit 100 + eval 20，≤15s）
        run: |
          python finetune/prepare_data.py \
            --source fleurs --fleurs-lang cmn_hans_cn --limit 100 --eval-limit 20 \
            --max-audio-secs 15 --optimizer none --tasks "" \
            --audio-dir data/audio --out data/dump_train.jsonl --eval-out data/dump_eval.jsonl \
            --dump-transcripts data/transcripts.txt
          wc -l data/transcripts.txt
          head -5 data/transcripts.txt

      - name: 上传转写清单
        uses: actions/upload-artifact@v7
        with:
          name: unified-transcripts
          path: data/transcripts.txt
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------- real-mini
  real-mini:
    name: CPU 真实微调（固定对照表，无需 API key）
    if: ${{ inputs.mode == 'real-mini' }}
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache HuggingFace 模型
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-qwen3-asr-${{ env.MODEL_TAG }}-v1

      - name: 安装依赖
        run: |
          set -e
          pip install --quiet --upgrade pip
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet qwen-asr peft datasets soundfile librosa

      - name: 检查对照表
        run: |
          if [ ! -f finetune/table_zh.tsv ]; then
            echo "::error::缺少 finetune/table_zh.tsv（task<TAB>源转写<TAB>目标文本 三列 TSV）。"
            echo "先跑一次 cpu-smoke，从 artifact 里取 data/transcripts.txt，"
            echo "离线整理成对照表提交进仓库，再触发本模式（qsa real-mini 同款流程）。"
            exit 1
          fi
          echo "对照表行数: $(grep -cv '^#' finetune/table_zh.tsv)"
          head -3 finetune/table_zh.tsv

      - name: 构造数据（table 优化后端 + 静音样本）
        run: |
          python finetune/prepare_data.py \
            --source fleurs --fleurs-lang cmn_hans_cn --limit 100 --eval-limit 20 --max-audio-secs 15 \
            --optimizer table --table finetune/table_zh.tsv --skip-unoptimized \
            --tasks "${{ inputs.tasks }}" --asr-ratio ${{ inputs.asr_ratio }} --silence-samples 20 \
            --audio-dir data/audio --out data/train.jsonl --eval-out data/eval.jsonl
          echo "训练集 $(wc -l < data/train.jsonl) 条 / 评测集 $(wc -l < data/eval.jsonl) 条"
          python - <<'PY'
          import json, pathlib
          rows = [json.loads(l) for l in pathlib.Path('data/train.jsonl').read_text(encoding='utf-8').splitlines() if l.strip()]
          sil  = [r for r in rows if r['task'] == 'silence']
          real = [r for r in rows if r['task'] != 'silence']
          mt   = [r for r in real if r['prompt']]
          asr  = [r for r in real if not r['prompt']]
          print(f'  任务 {len(mt)} 条 / verbatim {len(asr)} 条 / 静音 {len(sil)} 条')
          for r in mt[:3]:
              print('   例:', r['task'], r['text'][:60])
          if not mt:
              raise SystemExit('没有任务样本（对照表全部未命中？）')
          if not sil:
              raise SystemExit('没有静音样本（--silence-samples 未生效？）')
          PY

      - name: LoRA 微调（CPU）
        run: |
          python finetune/sft_lora.py \
            --model "${{ inputs.model }}" --train data/train.jsonl --eval data/eval.jsonl \
            --out out/real --device cpu --lora --lora-r 32 --lora-alpha 64 \
            --epochs 4 --max-steps -1 --batch-size 1 --grad-acc 2 \
            --lr 3e-4 --log-steps 10

      - name: 评测（任务生效 / 未遗忘 / 静音行为）
        run: |
          python finetune/eval_unified.py \
            --model "${{ inputs.model }}" --adapter out/real/lora \
            --eval data/eval.jsonl --limit 20 --device cpu --silence-secs 2 \
            --source-script cjk --out out/real/eval_report.json

      - name: 基座模型静音诊断（归因用，不挂适配器）
        run: |
          python finetune/eval_unified.py \
            --model "${{ inputs.model }}" --silence-only \
            --device cpu --silence-secs 2 --out out/real/base_silence.json

      - name: 判定（三项强制，qsa real-mini 同款口径）
        run: |
          python - <<'PY'
          import json, pathlib
          ev = json.loads(pathlib.Path('out/real/eval_report.json').read_text(encoding='utf-8'))
          tr = json.loads(pathlib.Path('out/real/train_report.json').read_text(encoding='utf-8'))
          bp = pathlib.Path('out/real/base_silence.json')
          base = json.loads(bp.read_text(encoding='utf-8')) if bp.is_file() else None
          m, c = ev['metrics'], ev['checks']
          print('=== 真实微调结论 ===')
          print(f"  训练样本 {tr['train_samples']} 条 / loss {tr['final_loss']:.4f} / {tr['train_seconds']:.0f}s")
          for k in sorted(m):
              print(f"  {k} = {m[k]}")
          if base is not None:
              print(f"  静音输出（基座） = {json.dumps(base.get('silence'), ensure_ascii=False)[:300]}")
          for task, items in ev['samples'].items():
              for s in items[:2]:
                  print(f"    [{task}] {s['out'][:60]}")
          for k, v in c.items():
              print(f"  {'✔' if v else '✘'} {k}")
          fails = []
          task_checks = {k: v for k, v in c.items() if k.startswith('task_takes_effect')}
          if task_checks and not all(task_checks.values()):
              bad = [k for k, v in task_checks.items() if not v]
              fails.append(f'任务未生效: {bad}。需要更多样本/步数/更大 LoRA 秩，或改 GPU 放量。')
          if c.get('no_catastrophic_forgetting') is False:
              fails.append('灾难性遗忘：verbatim 输出与参考相似度过低或整条泄漏。提高 --asr-ratio 或减少步数。')
          base_ok = bool(base and base.get('checks', {}).get('silence_is_empty'))
          if c.get('silence_is_empty') is False:
              if base_ok:
                  fails.append('静音行为被训坏（基座为空、挂适配器后非空）：增大 --silence-samples、降 lr 或减 epoch。')
              else:
                  print('⚠ 基座在 transformers 路径下对纯数字静音也非空——静音异常不归因于本次微调，仅警示。')
          if fails:
              for f in fails:
                  print('✘', f)
              raise SystemExit(1)
          print('✔ 判定通过——任务开关成立 / 未遗忘 / 静音行为保留（或与基座一致）')
          PY

      - name: 上传适配器与报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unified-real-mini
          path: |
            out/real/lora
            out/real/train_report.json
            out/real/eval_report.json
            out/real/base_silence.json
            data/train.jsonl
            data/eval.jsonl
          if-no-files-found: warn
          retention-days: 60

  # ---------------------------------------------------------------- gpu-train
  gpu-train:
    name: GPU 真实训练（需 self-hosted + gpu runner）
    if: ${{ inputs.mode == 'gpu-train' }}
    runs-on: [self-hosted, gpu]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          set -e
          pip install --quiet --upgrade pip
          pip install --quiet qwen-asr peft datasets soundfile librosa
          MAX_JOBS=4 pip install -U flash-attn --no-build-isolation || echo "flash-attn 安装失败，继续"
          python -c "import torch; print('torch', torch.__version__, 'cuda', torch.cuda.is_available())"

      - name: 构造数据（FLEURS cmn_hans_cn + API 优化后端，system=任务提示词原文）
        env:
          SHUO_OPT_API_KEY: ${{ secrets.SHUO_OPT_API_KEY }}
        run: |
          python finetune/prepare_data.py \
            --source fleurs --fleurs-lang cmn_hans_cn --limit ${{ inputs.samples }} --eval-limit 40 \
            --max-audio-secs 20 --optimizer api --tasks "${{ inputs.tasks }}" \
            --api-base "${{ vars.SHUO_OPT_API_BASE }}" --api-model "${{ vars.SHUO_OPT_API_MODEL }}" \
            --api-key-env SHUO_OPT_API_KEY --asr-ratio 0.4 --silence-samples 200 \
            --audio-dir data/audio --out data/train.jsonl --eval-out data/eval.jsonl
          wc -l data/train.jsonl data/eval.jsonl

      - name: LoRA 微调
        run: |
          python finetune/sft_lora.py \
            --model "${{ inputs.model }}" --train data/train.jsonl --eval data/eval.jsonl \
            --out out/unified --lora --lora-r 16 --lora-alpha 32 \
            --epochs 1 --max-steps ${{ inputs.steps }} --batch-size 4 --grad-acc 4 \
            --lr 2e-4 --warmup-steps 50 --log-steps 10 --save-steps 200 --grad-ckpt

      - name: 评测
        run: |
          python finetune/eval_unified.py \
            --model "${{ inputs.model }}" --adapter out/unified/lora \
            --eval data/eval.jsonl --limit 40 --silence-secs 2 \
            --source-script cjk --out out/unified/eval_report.json

      - name: 上传适配器与报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unified-lora-adapter
          path: |
            out/unified/lora
            out/unified/train_report.json
            out/unified/eval_report.json
          if-no-files-found: warn
          retention-days: 90

  # ------------------------------------------------------------- onnx-inspect
  onnx-inspect:
    name: Gate 1 探针（Daumee int8 包张量地图 + 值匹配 go/no-go）
    if: ${{ inputs.mode == 'onnx-inspect' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache Daumee ONNX 包（约 2.5GB）
        uses: actions/cache@v4
        with:
          path: models
          key: daumee-qwen3-asr-0.6b-onnx-v1

      - name: Cache HuggingFace 基座
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-qwen3-asr-${{ env.MODEL_TAG }}-v1

      - name: 下载 Daumee 包（缓存命中则跳过实际下载）
        run: |
          set -e
          pip install --quiet huggingface_hub
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          p = snapshot_download(os.environ["DAUMEE_REPO"], local_dir=os.environ["DAUMEE_DIR"])
          print("模型目录:", p)
          PY
          ls -la "$DAUMEE_DIR" "$DAUMEE_DIR/onnx_models" | head -30

      - name: 下载 LoRA 适配器 artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.adapter_artifact }}
          run-id: ${{ inputs.adapter_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: art

      - name: 安装依赖
        run: pip install --quiet onnx numpy safetensors huggingface_hub

      - name: 跑 Gate 1 探针
        run: |
          set -e
          ADAPTER=art/out/smoke/lora
          [ -d "$ADAPTER" ] || ADAPTER=art/out/real/lora
          [ -d "$ADAPTER" ] || { echo "::error::artifact 里找不到适配器（out/smoke/lora 或 out/real/lora）"; exit 1; }
          echo "适配器: $ADAPTER"
          python finetune/inspect_onnx_lora.py \
            --model-dir "$DAUMEE_DIR" \
            --hf-model "${{ inputs.model }}" --adapter "$ADAPTER" \
            --out out/inspect/onnx_patch_report.json

      - name: go/no-go 判定（NO-GO 判红）
        run: |
          python - <<'PY'
          import json, pathlib
          rep = json.loads(pathlib.Path('out/inspect/onnx_patch_report.json').read_text(encoding='utf-8'))
          verdict = rep.get('verdict', [])
          for v in verdict:
              print(' ', v)
          nogo = [v for v in verdict if v.startswith('NO-GO')]
          w = rep.get('worst', {})
          print(f"  适配器映射 {rep.get('adapter_mapped')}/{rep.get('adapter_modules')}"
                f" | 匹配 rel_err 最大 {w.get('match_rel_err')} | 削顶最坏 {w.get('clip_frac')}")
          if nogo:
              print('::error::Gate 1 判定 NO-GO——补丁路线不放行，先修映射/阈值再动补丁')
              raise SystemExit(1)
          print('✔ Gate 1 全 GO：适配器可全量映射，可进入 Gate 2（onnx-patch）')
          PY

      - name: 上传探针报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unified-onnx-inspect
          path: out/inspect/onnx_patch_report.json
          if-no-files-found: warn
          retention-days: 30

  # --------------------------------------------------------------- onnx-patch
  onnx-patch:
    name: Gate 2 补丁（LoRA→Daumee int8 包→unified 目录 + ORT 行为复测）
    if: ${{ inputs.mode == 'onnx-patch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache Daumee ONNX 包
        uses: actions/cache@v4
        with:
          path: models
          key: daumee-qwen3-asr-0.6b-onnx-v1

      - name: Cache HuggingFace 基座
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-qwen3-asr-${{ env.MODEL_TAG }}-v1

      - name: 下载 Daumee 包
        run: |
          set -e
          pip install --quiet huggingface_hub
          python -c "import os; from huggingface_hub import snapshot_download; snapshot_download(os.environ['DAUMEE_REPO'], local_dir=os.environ['DAUMEE_DIR'])"

      - name: 下载 LoRA 适配器 artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.adapter_artifact }}
          run-id: ${{ inputs.adapter_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: art

      - name: 安装依赖（补丁 + ORT 验证）
        run: pip install --quiet onnx numpy safetensors huggingface_hub onnxruntime tokenizers librosa soundfile

      - name: 跑补丁器（cpu-smoke 适配器=管线验证；real-mini 适配器=行为验证）
        run: |
          set -e
          ADAPTER=art/out/smoke/lora
          [ -d "$ADAPTER" ] || ADAPTER=art/out/real/lora
          echo "适配器: $ADAPTER"
          echo "ADAPTER_KIND=$([ "$ADAPTER" = "art/out/real/lora" ] && echo real || echo smoke)" >> "$GITHUB_ENV"
          python finetune/patch_onnx_lora.py \
            --model-dir "$DAUMEE_DIR" \
            --hf-model "${{ inputs.model }}" --adapter "$ADAPTER" \
            --out-dir models/Qwen3-ASR-0.6B-ONNX-CPU-unified \
            --report out/patch/patch_report.json
          ls -la models/Qwen3-ASR-0.6B-ONNX-CPU-unified models/Qwen3-ASR-0.6B-ONNX-CPU-unified/onnx_models
          test -f models/Qwen3-ASR-0.6B-ONNX-CPU-unified/unified.json
          python -c "import json; d=json.load(open('models/Qwen3-ASR-0.6B-ONNX-CPU-unified/unified.json',encoding='utf-8')); print(json.dumps({k:d[k] for k in ('kind','patched_modules','lora')}, ensure_ascii=False))"

      - name: 下载中文测试音频（real 适配器行为验证用，训练未见过的外部音频）
        run: |
          curl -sL --fail --retry 3 -o zh.wav "https://huggingface.co/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main/test_wavs/zh.wav"
          python3 -c "import wave; w=wave.open('zh.wav'); print('zh.wav', w.getnframes()/w.getframerate(), 's')"

      - name: ORT 行为复测（smoke=管线/格式断言；real=任务生效+静音双模式断言）
        run: |
          set -e
          if [ "$ADAPTER_KIND" = "real" ]; then
            # Gate 3 完整行为验证：real-mini 适配器补丁包在量化 ONNX 运行时上
            # 必须兑现「translate_en 直出英文 + 静音双模式空」（qsa T4 教训：
            # int8 量化会改变行为，必须在最终运行时形态复测）
            python finetune/verify_unified_onnx.py \
              --model-dir models/Qwen3-ASR-0.6B-ONNX-CPU-unified \
              --audio zh.wav \
              --check-set unified --expect-task translate_en --silence-secs 2 \
              --threads 4 --report out/patch/verify_report.json
          else
            python finetune/verify_unified_onnx.py \
              --model-dir models/Qwen3-ASR-0.6B-ONNX-CPU-unified \
              --audio "$DAUMEE_DIR/test_audio/librispeech_1_1089_1.wav" \
              --check-set smoke --expect-task translate_en --silence-secs 2 \
              --threads 4 --report out/patch/verify_report.json
          fi

      - name: 补丁前后对照（原始包也必须仍可推理——补丁不破坏基线）
        run: |
          python finetune/verify_unified_onnx.py \
            --model-dir "$DAUMEE_DIR" \
            --audio "$DAUMEE_DIR/test_audio/librispeech_1_1089_1.wav" \
            --check-set base --expect-task translate_en --silence-secs 0 \
            --threads 4 --report out/patch/verify_base_report.json

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unified-onnx-patch
          path: |
            out/patch/patch_report.json
            out/patch/verify_report.json
            out/patch/verify_base_report.json
          if-no-files-found: warn
          retention-days: 30

  # ------------------------------------------------------------------ ort-e2e
  ort-e2e:
    name: Gate 3 产品运行时（真实 Daumee 包 + Rust ort 管线 cargo test）
    if: ${{ inputs.mode == 'ort-e2e' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 系统依赖（与 ci.yml rust-linux 同套）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libssl-dev libxdo-dev librsvg2-dev \
            libgtk-3-dev libasound2-dev libsoup-3.0-dev pkg-config file

      - name: Cache Daumee ONNX 包
        uses: actions/cache@v4
        with:
          path: models
          key: daumee-qwen3-asr-0.6b-onnx-v1

      - name: 下载 Daumee 包
        run: |
          set -e
          pip install --quiet huggingface_hub
          python -c "import os; from huggingface_hub import snapshot_download; snapshot_download(os.environ['DAUMEE_REPO'], local_dir=os.environ['DAUMEE_DIR'])"
          ls "$DAUMEE_DIR/test_audio"

      - uses: dtolnay/rust-toolchain@stable

      - name: 真实模型 cargo test（asr 模块：参考 wav 转写 + context 冒烟）
        working-directory: src-tauri
        run: |
          export SHUO_ASR_DIR="$GITHUB_WORKSPACE/$DAUMEE_DIR"
          cargo test --release asr:: -- --nocapture --test-threads 1

      - name: Python 参照管线对照（同一 wav，空 context 转写一致性）
        run: |
          set -e
          pip install --quiet onnxruntime tokenizers librosa numpy
          python finetune/verify_unified_onnx.py \
            --model-dir "$DAUMEE_DIR" \
            --audio "$DAUMEE_DIR/test_audio/librispeech_0_1089_0.wav" \
            --check-set base --silence-secs 0 --threads 4 \
            --report out/orte2e/base_report.json
          python -c "import json; r=json.load(open('out/orte2e/base_report.json',encoding='utf-8')); t=r['results'][0]['verbatim']['text']; print('TEXT:', t); assert len(t) > 20, '转写太短'"

  # ------------------------------------------------------------------ gguf-e2
  # GGUF 产线（E2 同款，qsa 已全链路实测）：LoRA 合并回 HF → llama.cpp 官方转换器
  # （TEXT+MMPROJ 双类）→ LM Q4_K_M + mmproj q8_0 → llama-server 探针（context 通道 /
  # 静音 / 对照组）。产出可缓存给产品 e2e 复用（跨 OS）。
  gguf-e2:
    name: GGUF E2：LoRA 合并→转换→量化→llama-server 探针
    if: ${{ inputs.mode == 'gguf-e2' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache HuggingFace 基座
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-qwen3-asr-${{ env.MODEL_TAG }}-v1

      - name: 安装依赖（torch CPU + qwen-asr + peft）
        run: |
          set -e
          pip install --quiet --upgrade pip
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet qwen-asr peft safetensors numpy soundfile librosa

      - name: 下载 LoRA 适配器 artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.adapter_artifact }}
          run-id: ${{ inputs.adapter_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: art

      - name: 准备 llama.cpp（源码 pin b11201 + ubuntu 预编译二进制）
        run: |
          set -e
          git clone --depth 1 --branch b11201 https://github.com/ggml-org/llama.cpp llama.cpp
          pip install --quiet ./llama.cpp/gguf-py
          if [ -f llama.cpp/requirements/requirements-convert_hf_to_gguf.txt ]; then
            pip install --quiet -r llama.cpp/requirements/requirements-convert_hf_to_gguf.txt
          else
            pip install --quiet transformers sentencepiece protobuf
          fi
          # ubuntu 预编译是 .tar.gz（windows 才是 .zip——qsa E2 首跑 404 实测教训）
          curl -sL --fail --retry 3 -o llama-bin.tar.gz \
            "https://github.com/ggml-org/llama.cpp/releases/download/b11201/llama-b11201-bin-ubuntu-x64.tar.gz"
          mkdir -p llama-bin
          tar -xzf llama-bin.tar.gz -C llama-bin
          find llama-bin -type f \( -name "llama-quantize" -o -name "llama-server" \)
          chmod +x $(find llama-bin -type f -name "llama-*")

      - name: 下载中文测试音频
        run: |
          curl -sL --fail --retry 3 -o zh.wav "https://huggingface.co/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main/test_wavs/zh.wav"
          python3 -c "import wave; w=wave.open('zh.wav'); print('zh.wav', w.getnframes()/w.getframerate(), 's')"

      - name: 合并 LoRA 回 HF 基座
        run: |
          set -e
          ADAPTER=art/out/smoke/lora
          [ -d "$ADAPTER" ] || ADAPTER=art/out/real/lora
          [ -d "$ADAPTER" ] || ADAPTER=art/out/unified/lora
          echo "适配器: $ADAPTER"
          python finetune/merge_lora_hf.py --base "${{ inputs.model }}" \
            --adapter "$ADAPTER" --out merged/unified

      - name: 转换 GGUF（LM f16 + mmproj q8_0）
        run: |
          set -e
          python llama.cpp/convert_hf_to_gguf.py merged/unified --outfile unified-f16.gguf --outtype f16
          # b11201 的 --mmproj 按 --outfile 原名落盘（不自动加 mmproj- 前缀，qsa E2 实测）
          python llama.cpp/convert_hf_to_gguf.py merged/unified --mmproj --outfile mmproj-unified-q8.gguf --outtype q8_0
          ls -la *.gguf

      - name: 量化 LM 到 Q4_K_M + 体积账
        run: |
          set -e
          Q=$(find llama-bin -type f -name llama-quantize | head -1)
          "$Q" unified-f16.gguf unified-Q4_K_M.gguf Q4_K_M
          python3 - <<'PY'
          import pathlib
          lm = pathlib.Path("unified-Q4_K_M.gguf").stat().st_size
          mm = pathlib.Path("mmproj-unified-q8.gguf").stat().st_size
          gib = (lm + mm) / 2**30
          print(f"LM Q4_K_M {lm/2**30:.2f} GiB + mmproj {mm/2**30:.2f} GiB = {gib:.2f} GiB")
          pathlib.Path("out_size.txt").write_text(f"{gib:.3f}\n")
          PY

      - name: 缓存统一包 GGUF（跨 OS，供后续 e2e 还原）
        continue-on-error: true   # key 已存在（重跑产线）时 save 会报错，不算失败
        uses: actions/cache/save@v4
        with:
          path: |
            unified-Q4_K_M.gguf
            mmproj-unified-q8.gguf
          key: shuo-unified-gguf-${{ env.MODEL_TAG }}-v1
          enableCrossOsArchive: true

      - name: 启动 llama-server 并跑探针（context 通道 + 静音 + 对照）
        run: |
          set -e
          S=$(find llama-bin -type f -name llama-server | head -1)
          "$S" -m unified-Q4_K_M.gguf --mmproj mmproj-unified-q8.gguf --port 8080 --jinja -t 4 -c 4096 \
            > server.out.log 2> server.err.log &
          SRV_PID=$!
          code=0
          python finetune/gguf_server_probe.py --url http://127.0.0.1:8080 \
            --audio zh.wav --expect "${{ inputs.expect }}" --check-silence \
            --out out/gguf/e2_report.json || code=$?
          kill $SRV_PID 2>/dev/null || true
          echo "=== server 日志末尾 ==="
          tail -n 20 server.err.log server.out.log || true
          exit $code

      - name: 组装可下载模型包（unified.json 标记 + 安装说明）
        run: |
          set -e
          mkdir -p model-bundle
          cp unified-Q4_K_M.gguf mmproj-unified-q8.gguf model-bundle/
          python - <<'PY'
          import json, sys, time
          sys.path.insert(0, "finetune")
          from prompts import all_prompts
          marker = {
              "kind": "shuo-unified-asr-gguf",
              "base_hf_model": "${{ inputs.model }}",
              "quant": {"lm": "Q4_K_M", "mmproj": "q8_0"},
              "prompts": all_prompts(),
              "created_utc": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
          }
          with open("model-bundle/unified.json", "w", encoding="utf-8") as f:
              json.dump(marker, f, ensure_ascii=False, indent=2)
          install = "\n".join([
              "# 说 · Shuo 单模型直出统一包（Qwen3-ASR GGUF）",
              "",
              "把本目录整体放到模型查找路径下，目录名保持 `Qwen3-ASR-1.7B-GGUF-unified`：",
              "",
              "    ~/.shuo/models/Qwen3-ASR-1.7B-GGUF-unified/",
              "    ├── unified-Q4_K_M.gguf        # LM（非 mmproj 前缀 → 识别为语言模型）",
              "    ├── mmproj-unified-q8.gguf     # 音频编码器（mmproj 前缀）",
              "    └── unified.json               # 统一包标记（缺它 app 视为基座包）",
              "",
              "使用 feat/gguf-1.7b 构建的 Shuo（asr_backend=auto 默认）会自动优先加载",
              "GGUF 统一包；设置 → 单模型直出 → 开启，选任务预设（书面化/翻译/简略/详细）即可。",
              "unified.json 里的 prompts 是本包训练覆盖的任务提示词清单。",
          ]) + "\n"
          with open("model-bundle/INSTALL.md", "w", encoding="utf-8") as f:
              f.write(install)
          print("unified.json:", json.dumps({k: marker[k] for k in ("kind", "base_hf_model", "quant")}, ensure_ascii=False))
          PY
          ls -la model-bundle

      - name: 上传统一模型包 artifact（实际体验测试用：下载→按 INSTALL.md 落盘）
        uses: actions/upload-artifact@v7
        with:
          name: shuo-unified-gguf-${{ env.MODEL_TAG }}
          path: model-bundle
          if-no-files-found: error
          retention-days: 30

      - name: 上传 E2 报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unified-gguf-e2
          path: |
            out/gguf/e2_report.json
            merge_report.json
            server.out.log
            server.err.log
            out_size.txt
          if-no-files-found: warn
          retention-days: 30

  # ------------------------------------------------------------- gguf-publish
  # 把统一包发布为 GitHub **pre-release**（供直接下载，需求③）：
  # 从 gguf-e2 的跨 OS 缓存还原 GGUF（没跑过 gguf-e2 会 fail-on-cache-miss 明示）
  # → 生成 unified.json / SHA256SUMS / 发布说明 → 创建或更新 prerelease
  # （tag `model-unified-<尺寸>-pre`，重跑=资产覆盖更新）。
  gguf-publish:
    name: 发布统一包到 pre-release
    if: ${{ inputs.mode == 'gguf-publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # 创建 release / 上传资产
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 校验 source_run（必须指定产出统一包 artifact 的 gguf-e2 run）
        run: |
          if [ -z "${{ inputs.source_run }}" ]; then
            echo "::error::gguf-publish 需要 source_run 输入（gguf-e2 run id，其 artifact shuo-unified-gguf-${{ env.MODEL_TAG }} 为发布内容）"
            exit 1
          fi

      - name: 下载指定 gguf-e2 run 的统一包 artifact（与探针验证过的文件完全一致）
        uses: actions/download-artifact@v7
        with:
          name: shuo-unified-gguf-${{ env.MODEL_TAG }}
          run-id: ${{ inputs.source_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: art

      - name: 组装发布资产（SHA256SUMS + 发布说明；unified.json 沿用包内原件）
        run: |
          set -e
          mkdir -p dist
          cp art/unified-Q4_K_M.gguf art/mmproj-unified-q8.gguf art/unified.json dist/
          python - <<'PY'
          import json
          marker = json.load(open("dist/unified.json", encoding="utf-8"))
          prompts_md = [f"| `{k}` | {v or '（空串=逐字转写）'} |" for k, v in marker.get("prompts", {}).items()]
          notes = "\n".join([
              "# 说 · Shuo 单模型直出统一包（pre-release）",
              "",
              f"微调 Qwen3-ASR（{marker.get('base_hf_model')}，AuT 音频编码器来自 Qwen3-Omni）的",
              "「单模型直出」统一包：语音识别 + 按 system 段提示词优化文本一步完成，无需 LLM 后处理。",
              "LoRA（120 句对照表，real-mini 配方）合并回 HF 后经 llama.cpp 官方转换器量化：",
              "LM Q4_K_M + mmproj q8_0（合计约 1.36 GiB）。",
              "",
              "## 任务提示词（训练覆盖，逐字对表 finetune/prompts.py）",
              "",
              "| key | system 段提示词 |",
              "|---|---|",
              *prompts_md,
              "",
              "自定义提示词仅对训练覆盖过的指令可靠。",
              "",
              "## 安装（feat/gguf-1.7b 构建的 Shuo）",
              "",
              "1. 下载 `unified-Q4_K_M.gguf`、`mmproj-unified-q8.gguf`、`unified.json` 三个文件；",
              "2. 放入 `~/.shuo/models/Qwen3-ASR-1.7B-GGUF-unified/`（目录名必须一致，",
              "   `unified.json` 是统一包标记）；",
              "3. 启动 Shuo（asr_backend=auto 自动优先 GGUF）→ 设置 → 单模型直出 → 开启。",
              "",
              "## 校验",
              "",
              "`SHA256SUMS` 提供两个 GGUF 的校验和。",
              "",
              "## 性质与限制",
              "",
              f"* 构建时间（UTC）：{marker.get('created_utc')}；",
              "* **pre-release**：训练数据为 120 句 FLEURS 朗读语料对照表（real-mini 规模），",
              "  任务开关/静音行为已在 CI 全链验证（见仓库 finetune/README.md 实测记录），",
              "  词级精度未达产品级——放量用 gpu-train（≥2000 句）后重发本 release 即可；",
              "* 基座 Qwen3-ASR 权重版权归 Alibaba Group（Apache 2.0）；LoRA 增量由本仓库产线生成。",
          ]) + "\n"
          open("dist/RELEASE-NOTES.md", "w", encoding="utf-8").write(notes)
          PY
          (cd dist && sha256sum unified-Q4_K_M.gguf mmproj-unified-q8.gguf > SHA256SUMS)
          ls -la dist && cat dist/SHA256SUMS

      - name: 创建/更新 pre-release 并上传资产
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="model-unified-${{ env.MODEL_TAG }}-pre"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/unified-Q4_K_M.gguf dist/mmproj-unified-q8.gguf \
              dist/unified.json dist/SHA256SUMS dist/RELEASE-NOTES.md \
              --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --prerelease \
              --notes-file dist/RELEASE-NOTES.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" \
              dist/unified-Q4_K_M.gguf dist/mmproj-unified-q8.gguf \
              dist/unified.json dist/SHA256SUMS \
              --prerelease --repo "$GITHUB_REPOSITORY" \
              --title "单模型直出统一包（Qwen3-ASR-${{ env.MODEL_TAG }} GGUF）" \
              --notes-file dist/RELEASE-NOTES.md
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"

  # ----------------------------------------------------------------- gguf-e2e
  # 产品运行时验证（E1 同款语义）：Rust GGUF 后端（llama-cpp-sys-2 静态链接）加载
  # 官方 ggml-org/Qwen3-ASR-1.7B-GGUF（Q8_0），对参考 wav 真实转写 + context 冒烟。
  # 证明「迁移推理框架 + 换 1.7B」的运行时链路在 CI 上端到端可用。
  gguf-e2e:
    name: GGUF E2E：Rust 运行时 + 官方 1.7B GGUF 真实转写
    if: ${{ inputs.mode == 'gguf-e2e' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 系统依赖（WebKitGTK + libclang for bindgen）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libssl-dev libxdo-dev librsvg2-dev \
            libgtk-3-dev libasound2-dev libsoup-3.0-dev pkg-config file
          if ! ldconfig -p | grep -q libclang; then
            sudo apt-get install -y -qq libclang-dev clang >/dev/null
          fi
          LIBCLANG=$(dirname "$(find /usr/lib -name 'libclang.so*' 2>/dev/null | head -1)")
          echo "LIBCLANG_PATH=$LIBCLANG" >> "$GITHUB_ENV"

      - name: Cache 官方 1.7B GGUF（Q8_0 LM 2.0GiB + mmproj 0.33GiB）
        uses: actions/cache@v4
        with:
          path: gguf-models
          key: ggml-qwen3-asr-1.7b-q8-v1

      - name: 下载官方 GGUF（缓存命中则跳过实际下载）
        run: |
          set -e
          pip install --quiet huggingface_hub
          mkdir -p gguf-models
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          for f in ("Qwen3-ASR-1.7B-Q8_0.gguf", "mmproj-Qwen3-ASR-1.7B-Q8_0.gguf"):
              p = hf_hub_download("ggml-org/Qwen3-ASR-1.7B-GGUF", f, local_dir="gguf-models")
              print("下载:", p)
          PY
          # 英文参考音频（Daumee 包同款 LibriSpeech 样本，单文件直连下载）
          curl -sL --fail --retry 3 -o gguf-models/ref_en.wav \
            "https://huggingface.co/Daumee/Qwen3-ASR-0.6B-ONNX-CPU/resolve/main/test_audio/librispeech_1_1089_1.wav"
          ls -la gguf-models

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust GGUF 运行时测试（真实模型转写 + context 冒烟）
        working-directory: src-tauri
        run: |
          export SHUO_GGUF_LM="$GITHUB_WORKSPACE/gguf-models/Qwen3-ASR-1.7B-Q8_0.gguf"
          export SHUO_GGUF_MM="$GITHUB_WORKSPACE/gguf-models/mmproj-Qwen3-ASR-1.7B-Q8_0.gguf"
          export SHUO_GGUF_WAV="$GITHUB_WORKSPACE/gguf-models/ref_en.wav"
          cargo test --release gguf -- --nocapture --test-threads 1
