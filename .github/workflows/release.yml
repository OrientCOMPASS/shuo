# 说 · Shuo — 打包 / 发版
#
# 触发：推 tag `v*`（例如 `git tag v0.2.1 && git push origin v0.2.1`），
#       或手动 `workflow_dispatch`（只构建，不建 release）。
#
# 不做缓存：每次都是干净构建，省心、结果可复现。
# 产物：Windows NSIS 安装包 / Linux deb + AppImage，统一挂到同一个 release。
name: 打包发版

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # AppImage 的 linuxdeploy 需要 FUSE，CI 里用解包运行模式
  APPIMAGE_EXTRACT_AND_RUN: "1"
  TAURI_CLI_VERSION: "3.0.0-alpha.5"

jobs:
  # ------------------------------------------------------------- Windows
  windows:
    name: Windows · NSIS
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 版本号（tag → tauri.conf.json + Cargo.toml）
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(python -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          python - "$VERSION" <<'PY'
          import json, pathlib, re, sys
          v = sys.argv[1]
          conf = pathlib.Path("src-tauri/tauri.conf.json")
          d = json.loads(conf.read_text(encoding="utf-8"))
          d["version"] = v
          conf.write_text(json.dumps(d, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          cargo = pathlib.Path("src-tauri/Cargo.toml")
          s = cargo.read_text(encoding="utf-8")
          s = re.sub(r'(?m)^version = "[^"]+"', f'version = "{v}"', s, count=1)
          cargo.write_text(s, encoding="utf-8")
          PY

      - uses: dtolnay/rust-toolchain@stable

      - name: 安装 tauri-cli
        run: |
          if ! command -v cargo-tauri >/dev/null 2>&1; then
            cargo install tauri-cli --version "$TAURI_CLI_VERSION" --locked
          fi

      - name: 构建 NSIS
        working-directory: src-tauri
        run: cargo tauri build

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # --------------------------------------------------------------- Linux
  linux:
    name: Linux · deb + AppImage
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 系统依赖（WebKitGTK 4.1 / ALSA / AppImage）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libssl-dev libxdo-dev librsvg2-dev \
            libgtk-3-dev libasound2-dev libsoup-3.0-dev \
            pkg-config file

      - name: 版本号（tag → tauri.conf.json + Cargo.toml）
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(python -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          python - "$VERSION" <<'PY'
          import json, pathlib, re, sys
          v = sys.argv[1]
          conf = pathlib.Path("src-tauri/tauri.conf.json")
          d = json.loads(conf.read_text(encoding="utf-8"))
          d["version"] = v
          conf.write_text(json.dumps(d, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          cargo = pathlib.Path("src-tauri/Cargo.toml")
          s = cargo.read_text(encoding="utf-8")
          s = re.sub(r'(?m)^version = "[^"]+"', f'version = "{v}"', s, count=1)
          cargo.write_text(s, encoding="utf-8")
          PY

      - uses: dtolnay/rust-toolchain@stable

      - name: 安装 tauri-cli
        run: |
          if ! command -v cargo-tauri >/dev/null 2>&1; then
            cargo install tauri-cli --version "$TAURI_CLI_VERSION" --locked
          fi

      - name: 构建 deb + AppImage
        working-directory: src-tauri
        run: cargo tauri build --bundles deb,appimage

      - name: 上传 deb
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: 上传 AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # -------------------------------------------------------------- Release
  release:
    name: 创建 Release
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 整理产物与版本号
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p out
          cp artifacts/*.deb "out/Shuo_${VERSION}_amd64.deb"
          cp artifacts/*.AppImage "out/Shuo_${VERSION}_amd64.AppImage"
          cp artifacts/*-setup.exe "out/Shuo_${VERSION}_x64-setup.exe"
          ls -lh out

      - name: 发布到 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* \
              --title "说 · Shuo ${VERSION}" \
              --notes "Windows: NSIS 安装包；Linux: deb + AppImage。模型不随包分发，首次使用请把 Qwen3-ASR-0.6B-ONNX-CPU 与 Qwen3.5-2B-ONNX-OPT 放到仓库根目录或 ~/.shuo/models（详见 README）。"
          fi
